name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ENV: test
      SECRET_KEY: ci-smoke-secret
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app tests

      - name: Run smoke checks
        run: python tests/smoke_app.py

      - name: Run security smoke checks
        run: python tests/smoke_security.py

  postgres-schema-smoke:
    name: PostgreSQL application smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: field_service_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d field_service_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: test
      SECRET_KEY: ci-postgresql-smoke-secret
      DATABASE_BACKEND: postgresql
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/field_service_test
      POSTGRESQL_EXPERIMENTAL: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app tests

      - name: Run PostgreSQL schema smoke
        run: python tests/smoke_postgresql.py

      - name: Run SQLite to PostgreSQL migration smoke
        run: python tests/smoke_postgresql_migration.py

      - name: Run PostgreSQL concurrency smoke
        run: python tests/smoke_postgresql_concurrency.py

      - name: Run PostgreSQL application smoke
        run: python tests/smoke_app.py
