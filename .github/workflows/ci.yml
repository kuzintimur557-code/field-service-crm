name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Audit production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt

  smoke:
    name: Smoke and security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ENV: test
      SECRET_KEY: ci-smoke-secret
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip check

      - name: Compile Python files
        run: python -m compileall -q app tests scripts

      - name: Run smoke checks
        run: python tests/smoke_app.py

      - name: Run security smoke checks
        run: python tests/smoke_security.py

      - name: Run production security startup smoke
        run: python tests/smoke_production_security.py

      - name: Run release verification smoke
        run: python tests/smoke_release.py

      - name: Run object storage smoke
        run: python tests/smoke_object_storage.py

      - name: Run background job smoke
        run: python tests/smoke_background_jobs.py

      - name: Run email inbox smoke
        run: python tests/smoke_email_inbox.py

      - name: Run call analysis smoke
        run: python tests/smoke_call_analysis.py

      - name: Run subscription smoke
        run: python tests/smoke_subscriptions.py

      - name: Run error monitoring smoke
        run: python tests/smoke_error_monitoring.py

  postgres-schema-smoke:
    name: PostgreSQL application smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: field_service_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d field_service_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: test
      SECRET_KEY: ci-postgresql-smoke-secret
      DATABASE_BACKEND: postgresql
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/field_service_test
      POSTGRESQL_EXPERIMENTAL: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip check

      - name: Compile Python files
        run: python -m compileall -q app tests scripts

      - name: Run PostgreSQL schema smoke
        run: python tests/smoke_postgresql.py

      - name: Run SQLite to PostgreSQL migration smoke
        run: python tests/smoke_postgresql_migration.py

      - name: Run PostgreSQL concurrency smoke
        run: python tests/smoke_postgresql_concurrency.py

      - name: Run PostgreSQL backup and restore smoke
        run: python tests/smoke_postgresql_backup.py

      - name: Run PostgreSQL application smoke
        run: python tests/smoke_app.py

  release-gate:
    name: Production release gate
    needs:
      - dependency-audit
      - smoke
      - postgres-schema-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every release check
        env:
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          SQLITE_SMOKE_RESULT: ${{ needs.smoke.result }}
          POSTGRESQL_SMOKE_RESULT: ${{ needs.postgres-schema-smoke.result }}
        run: |
          echo "Dependency audit: $DEPENDENCY_AUDIT_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "SQLite/security smoke: $SQLITE_SMOKE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "PostgreSQL smoke: $POSTGRESQL_SMOKE_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$DEPENDENCY_AUDIT_RESULT" = "success"
          test "$SQLITE_SMOKE_RESULT" = "success"
          test "$POSTGRESQL_SMOKE_RESULT" = "success"
